<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Issue Tracker</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f0f1f4;
    --border: #e2e4e9;
    --text: #1b1d22;
    --muted: #6b7280;
    --accent: #4f46e5;
    --done: #15803d;
    --done-soft: #e8f6ed;
    --pending: #b45309;
    --pending-soft: #fdf3e3;
    --high: #dc2626;
    --medium: #d97706;
    --low: #0891b2;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16, 20, 30, .06), 0 8px 24px rgba(16, 20, 30, .08);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117; --surface: #171a22; --surface-2: #1e222c; --border: #2a2f3b;
      --text: #e7e9ee; --muted: #9aa2b1; --accent: #8b8cf7; --done: #4ade80;
      --done-soft: #14301f; --pending: #fbbf24; --pending-soft: #33260f;
      --high: #f87171; --medium: #fbbf24; --low: #22d3ee; --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: var(--accent); color: #fff; display: grid; place-items: center;
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -.2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); background: var(--surface);
    padding: 8px 13px; border-radius: 9px; font-size: 14px; font-weight: 550;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { border-color: transparent; background: transparent; padding: 7px 9px; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { color: var(--danger); }
  .btn.icon { padding: 7px; line-height: 0; }
  .btn svg { width: 16px; height: 16px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
  }
  .stat .n { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .stat.done .n { color: var(--done); }
  .stat.pending .n { color: var(--pending); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 550;
  }
  .tab .count { opacity: .7; font-variant-numeric: tabular-nums; margin-left: 2px; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search { position: relative; flex: 1; min-width: 180px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 12px 8px 33px;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .list { display: flex; flex-direction: column; gap: 9px; }
  .issue {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 15px; display: flex; gap: 13px; box-shadow: var(--shadow);
  }
  .issue.is-done { background: color-mix(in srgb, var(--surface) 88%, var(--done-soft)); }
  .check {
    flex: none; width: 21px; height: 21px; margin-top: 1px; border-radius: 6px;
    border: 1.5px solid var(--border); background: transparent;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  .check svg { width: 14px; height: 14px; color: #fff; opacity: 0; }
  .check:hover { border-color: var(--done); }
  .check[aria-pressed="true"] { background: var(--done); border-color: var(--done); }
  .check[aria-pressed="true"] svg { opacity: 1; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; word-break: break-word; }
  .is-done .title { text-decoration: line-through; color: var(--muted); }
  .desc { color: var(--muted); font-size: 13.5px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    border: 1px solid transparent; text-transform: capitalize;
  }
  .pill.pending { background: var(--pending-soft); color: var(--pending); }
  .pill.done { background: var(--done-soft); color: var(--done); }
  .pill.high { color: var(--high); border-color: var(--high); }
  .pill.medium { color: var(--medium); border-color: var(--medium); }
  .pill.low { color: var(--low); border-color: var(--low); }
  .when { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 2px; flex: none; align-self: flex-start; }

  .empty {
    text-align: center; padding: 56px 20px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty p { margin: 0 0 14px; }

  .backdrop {
    position: fixed; inset: 0; background: rgba(10, 12, 18, .5);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 50; overflow-y: auto; backdrop-filter: blur(2px);
  }
  .backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 520px; padding: 22px; box-shadow: var(--shadow);
  }
  .modal h2 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 9px 11px;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
  }
  .field textarea { resize: vertical; min-height: 76px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
  .msg { font-size: 13px; margin: 0 0 12px; display: none; color: var(--danger); }
  .msg.show { display: block; }

  .toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 13.5px; font-weight: 550; box-shadow: var(--shadow);
    max-width: 92vw;
  }
  .toast.out { opacity: 0; transition: opacity .3s; }

  @media (max-width: 560px) {
    .stats { gap: 8px; }
    .stat { padding: 10px 11px; }
    .stat .n { font-size: 20px; }
    .row { grid-template-columns: 1fr; }
    .brand p { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
          <path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
      </div>
      <div>
        <h1>Mini Issue Tracker</h1>
        <p>Track what's done and what's pending</p>
      </div>
    </div>
    <button class="btn primary" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
      New issue
    </button>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Total</div></div>
    <div class="stat pending"><div class="n" id="statPending">0</div><div class="l">Pending</div></div>
    <div class="stat done"><div class="n" id="statDone">0</div><div class="l">Done</div></div>
  </section>

  <section class="toolbar">
    <div class="tabs" role="tablist" aria-label="Filter issues">
      <button class="tab" role="tab" data-filter="all">All <span class="count" id="cAll">0</span></button>
      <button class="tab" role="tab" data-filter="pending">Pending <span class="count" id="cPending">0</span></button>
      <button class="tab" role="tab" data-filter="done">Done <span class="count" id="cDone">0</span></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
      <input type="search" id="search" placeholder="Search issues…" aria-label="Search issues" />
    </div>
  </section>

  <main id="list" class="list"></main>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">New issue</h2>
    <form id="issueForm" novalidate>
      <div class="field">
        <label for="fieldTitle">Title</label>
        <input id="fieldTitle" maxlength="140" placeholder="Short summary of the issue" autocomplete="off" />
      </div>
      <div class="msg" id="formErr">Please enter a title.</div>
      <div class="field">
        <label for="fieldDesc">Description</label>
        <textarea id="fieldDesc" maxlength="2000" placeholder="Optional details, steps to reproduce, notes…"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="fieldStatus">Status</label>
          <select id="fieldStatus">
            <option value="pending">Pending</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="field">
          <label for="fieldPriority">Priority</label>
          <select id="fieldPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="foot">
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Create issue</button>
      </div>
    </form>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- state + storage ---------- */
  var STORE_KEY = "mini-issue-tracker.v1";
  var issues = load();
  var filter = "all";
  var query = "";
  var editingId = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(issues)); } catch (e) {}
  }

  /* ---------- helpers ---------- */
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() {
    return "i_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function timeAgo(ts) {
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    var m = Math.floor(s / 60); if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60); if (h < 24) return h + "h ago";
    var d = Math.floor(h / 24); if (d < 30) return d + "d ago";
    return new Date(ts).toLocaleDateString();
  }
  function byId(id) {
    for (var i = 0; i < issues.length; i++) if (issues[i].id === id) return issues[i];
    return null;
  }
  function toast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    el("toasts").appendChild(t);
    setTimeout(function () { t.classList.add("out"); }, 2400);
    setTimeout(function () { t.remove(); }, 2900);
  }
  function showMsg(node, text) {
    node.textContent = text || "";
    node.classList.toggle("show", Boolean(text));
  }

  /* ---------- rendering ---------- */
  var listEl = el("list");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function visibleIssues() {
    var q = query.trim().toLowerCase();
    return issues
      .filter(function (it) { return filter === "all" ? true : it.status === filter; })
      .filter(function (it) {
        if (!q) return true;
        return (it.title + " " + (it.description || "")).toLowerCase().indexOf(q) !== -1;
      })
      .sort(function (a, b) {
        if (a.status !== b.status) return a.status === "pending" ? -1 : 1;
        return b.updatedAt - a.updatedAt;
      });
  }

  function updateStats() {
    var total = issues.length;
    var done = issues.filter(function (i) { return i.status === "done"; }).length;
    var pending = total - done;
    el("statTotal").textContent = total;
    el("statDone").textContent = done;
    el("statPending").textContent = pending;
    el("cAll").textContent = total;
    el("cPending").textContent = pending;
    el("cDone").textContent = done;
    tabs.forEach(function (t) {
      t.setAttribute("aria-selected", String(t.dataset.filter === filter));
    });
  }

  function render() {
    updateStats();
    var items = visibleIssues();
    listEl.innerHTML = items.length ? items.map(card).join("") : emptyState(issues.length);
  }

  function card(it) {
    var isDone = it.status === "done";
    return '<article class="issue' + (isDone ? " is-done" : "") + '" data-id="' + esc(it.id) + '">' +
      '<button class="check" data-action="toggle" aria-pressed="' + isDone + '" ' +
        'aria-label="Mark as ' + (isDone ? "pending" : "done") + '" title="Toggle done">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +
        'stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>' +
      '</button>' +
      '<div class="body">' +
        '<div class="title">' + esc(it.title) + '</div>' +
        (it.description ? '<div class="desc">' + esc(it.description) + '</div>' : "") +
        '<div class="meta">' +
          '<span class="pill ' + esc(it.status) + '">' + esc(it.status) + '</span>' +
          '<span class="pill ' + esc(it.priority) + '">' + esc(it.priority) + '</span>' +
          '<span class="when">' + timeAgo(it.updatedAt || it.createdAt) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn ghost icon" data-action="edit" title="Edit issue" aria-label="Edit issue">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
          'stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/>' +
          '<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
        '</button>' +
        '<button class="btn ghost icon danger" data-action="delete" title="Delete issue" aria-label="Delete issue">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
          'stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>' +
        '</button>' +
      '</div>' +
    '</article>';
  }

  function emptyState(total) {
    var msg = total === 0
      ? "No issues yet. Create your first one to get started."
      : "No issues match this view.";
    var btn = total === 0
      ? '<button class="btn primary" data-action="new">Create issue</button>'
      : '<button class="btn" data-action="clear-filters">Clear filters</button>';
    return '<div class="empty"><p>' + esc(msg) + '</p>' + btn + '</div>';
  }

  /* ---------- list interactions (one delegated listener) ---------- */
  listEl.addEventListener("click", function (e) {
    var actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.dataset.action;

    if (action === "new") { openModal(null); return; }
    if (action === "clear-filters") {
      filter = "all"; query = ""; el("search").value = ""; render(); return;
    }

    var row = e.target.closest(".issue");
    if (!row) return;
    var it = byId(row.dataset.id);
    if (!it) return;

    if (action === "toggle") {
      it.status = it.status === "done" ? "pending" : "done";
      it.updatedAt = Date.now();
      save(); render();
      toast(it.status === "done" ? "Marked as done" : "Moved back to pending");
    } else if (action === "edit") {
      openModal(it);
    } else if (action === "delete") {
      if (confirm('Delete "' + it.title + '"?\nThis cannot be undone.')) {
        issues = issues.filter(function (x) { return x.id !== it.id; });
        save(); render();
        toast("Issue deleted");
      }
    }
  });

  tabs.forEach(function (t) {
    t.addEventListener("click", function () { filter = t.dataset.filter; render(); });
  });
  el("search").addEventListener("input", function (e) { query = e.target.value; render(); });

  /* ---------- create / edit dialog ---------- */
  var backdrop = el("backdrop");
  var fTitle = el("fieldTitle");
  var fDesc = el("fieldDesc");
  var fStatus = el("fieldStatus");
  var fPriority = el("fieldPriority");

  function openModal(issue) {
    editingId = issue ? issue.id : null;
    el("modalTitle").textContent = issue ? "Edit issue" : "New issue";
    el("saveBtn").textContent = issue ? "Save changes" : "Create issue";
    fTitle.value = issue ? issue.title : "";
    fDesc.value = issue ? (issue.description || "") : "";
    fStatus.value = issue ? issue.status : "pending";
    fPriority.value = issue ? issue.priority : "medium";
    showMsg(el("formErr"), "");
    backdrop.classList.add("open");
    document.body.style.overflow = "hidden";
    setTimeout(function () { fTitle.focus(); }, 30);
  }

  function closeModal() {
    backdrop.classList.remove("open");
    document.body.style.overflow = "";
    editingId = null;
  }

  el("newBtn").addEventListener("click", function () { openModal(null); });
  el("cancelBtn").addEventListener("click", closeModal);
  backdrop.addEventListener("mousedown", function (e) {
    if (e.target === backdrop) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && backdrop.classList.contains("open")) closeModal();
  });

  el("issueForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = fTitle.value.trim();
    if (!title) { showMsg(el("formErr"), "Please enter a title."); fTitle.focus(); return; }
    showMsg(el("formErr"), "");

    var now = Date.now();
    if (editingId) {
      var it = byId(editingId);
      if (it) {
        it.title = title;
        it.description = fDesc.value.trim();
        it.status = fStatus.value;
        it.priority = fPriority.value;
        it.updatedAt = now;
      }
      toast("Changes saved");
    } else {
      issues.push({
        id: uid(), title: title, description: fDesc.value.trim(),
        status: fStatus.value, priority: fPriority.value,
        createdAt: now, updatedAt: now
      });
      toast("Issue created");
    }
    save(); render(); closeModal();
  });

  render();
})();
</script>
</body>
</html>
